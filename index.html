<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="HTX Research — BTC市场参与者追踪日报"/>
  <title>HTX Research · BTC市场参与者日报</title>
  <meta property="og:title" content="HTX Research · BTC市场参与者日报"/>
  <meta property="og:description" content="每日追踪ETF买家、矿工、长期持有者、衍生品交易者和CTA基金的行为与仓位"/>
  <meta property="og:type" content="website"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" id="brand-home">
        <div class="brand-mark">H</div>
        <div class="brand-name">HTX Research <span class="dim">· BTC 市场参与者</span></div>
      </a>
      <div class="spacer"></div>
      <div class="btc-chip" id="btc-chip">
        <span class="dot"></span>
        <span class="num" style="font-weight:600;">BTC --</span>
      </div>
      <button class="icon-btn" id="theme-toggle" title="切换主题">☀</button>
    </div>
    <div class="topbar-inner" style="height:auto; padding-bottom:0;">
      <nav class="nav" id="nav"><!-- tabs injected by main.js --></nav>
    </div>
  </header>

  <!-- News ticker -->
  <div class="ticker-wrap">
    <div class="ticker-badge"><span class="pulse"></span>BTC 快讯</div>
    <div class="ticker" id="ticker"><!-- injected --></div>
  </div>

  <!-- Main -->
  <main class="app">
    <div id="view" class="fade"><!-- active section injected --></div>

    <div class="footer">
      <div>最后更新：<span class="num" id="footer-updated">—</span> · 设计风格 <strong style="color:var(--text);">Fintech · Agora</strong></div>
      <div>HTX Research · <span class="handle">@0xRisingCapital</span></div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" onclick="event.stopPropagation()"/>
  </div>

  <script src="main.js"></script>
</body>
</html>
