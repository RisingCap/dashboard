<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Rising Capital — BTC市场参与者追踪日报"/>
  <meta name="robots" content="index, follow"/>
  <title>HTX Research · BTC市场参与者日报</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Rising Capital · BTC市场参与者日报"/>
  <meta property="og:description" content="每日追踪ETF买家、矿工、长期持有者、衍生品交易者和CTA基金的行为与仓位"/>
  <meta property="og:type" content="website"/>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ══ Header ══════════════════════════════════════ -->
  <header class="site-header">
    <a class="header-logo" href="index.html">
      <div class="logo-mark">HTX</div>
      <span class="logo-text">HTX Research</span>
    </a>
  </header>

  <!-- ══ Main ════════════════════════════════════════ -->
  <main class="main-container">

    <!-- Latest Post (Hero) -->
    <div class="section-label">今日报告</div>
    <div id="hero-section">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>

    <!-- Archive -->
    <div class="section-label" style="margin-top: 40px;">历史记录</div>
    <div class="archive-grid" id="archive-section">
      <!-- archive cards injected by main.js -->
    </div>

  </main>

  <!-- ══ Footer ══════════════════════════════════════ -->
  <footer class="site-footer">
    <div>
      数据来源：
      <a href="https://sosovalue.xyz"     target="_blank" rel="noopener">SoSoValue</a> ·
      <a href="https://coinglass.com"     target="_blank" rel="noopener">CoinGlass</a> ·
      <a href="https://glassnode.com"     target="_blank" rel="noopener">Glassnode</a> ·
      <a href="https://velo.xyz"          target="_blank" rel="noopener">Velo</a> ·
      <a href="https://hashrateindex.com" target="_blank" rel="noopener">Hashrate Index</a> ·
      <a href="https://checkonchain.com"  target="_blank" rel="noopener">CheckOnChain</a>
    </div>
    <div style="margin-top:4px;">
      最后更新：<span id="footer-last-updated">—</span>
      &nbsp;·&nbsp;
      <strong>@0xRisingCapital</strong>
    </div>
  </footer>

  <!-- Lightbox overlay -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" onclick="event.stopPropagation()"/>
  </div>

  <script src="main.js"></script>
  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.getElementById('lightbox-img').src = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
